<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NatiJohn | Deploying...</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .animate-orbit {
      animation: orbit 8s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen overflow-hidden font-sans bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

  <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-white rounded-full opacity-40 animate-ping duration-1000"></div>
  <div class="absolute bottom-1/3 right-1/4 w-1.5 h-1.5 bg-cyan-400 rounded-full opacity-60 animate-pulse"></div>

  <div class="relative z-10 text-center px-6">
    
    <div class="relative w-24 h-24 mx-auto mb-8 flex items-center justify-center">
      <div class="absolute inset-0 border-2 border-dashed border-cyan-500/30 rounded-full animate-orbit"></div>
      <div class="w-12 h-12 bg-gradient-to-tr from-cyan-500 to-indigo-600 rounded-full blur-sm animate-pulse shadow-[0_0_30px_rgba(6,182,212,0.5)]"></div>
    </div>

    <h1 class="text-xs font-mono tracking-[0.3em] uppercase text-cyan-400 mb-3">
      NATIJOHN.DEV
    </h1>

    <h2 class="text-3xl md:text-5xl font-black tracking-tight mb-4 bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-500">
      SYSTEMS OFFLINE
    </h2>

    <p class="text-slate-400 max-w-md mx-auto text-sm md:text-base mb-8 font-light leading-relaxed">
      Building a high-performance digital ecosystem. The matrix is currently initializing. 
    </p>

    <div class="inline-flex items-center gap-2 bg-slate-900/80 border border-slate-800 px-4 py-2 rounded-full backdrop-blur-sm">
      <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span>
      <span class="text-xs font-mono text-slate-300 uppercase tracking-wider">Under Construction</span>
    </div>

  </div>

  <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b10_1px,transparent_1px),linear-gradient(to_bottom,#1e293b10_1px,transparent_1px)] bg-[size:4rem_4rem] pointer-events-none"></div>

</body>
</html>
